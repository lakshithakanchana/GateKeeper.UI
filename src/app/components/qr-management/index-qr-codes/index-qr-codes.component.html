<div class="container">

    <!--Header Card-->
    <mat-card class="header-card">
        <mat-card-header>
            <mat-card-title>QR Code - Index</mat-card-title>
            <mat-card-subtitle class="main-subtitle">
                QR Management
            </mat-card-subtitle>
        </mat-card-header>
        <mat-card-actions class="d-flex">
            <a mat-raised-button color="primary" routerLink="../New" class="mr-1">
                <mat-icon fontIcon="add"></mat-icon>
                New
            </a>
            <button mat-raised-button color="primary" matTooltip="Export as CSV" (click)="exportCsv()">
                <mat-icon fontIcon="download"></mat-icon>
                CSV
            </button>
            <span class="grow"></span>
            <button mat-icon-button (click)="refreshQrCodeList()" matTooltip="Refresh">
                <mat-icon>refresh</mat-icon>
            </button>
          </mat-card-actions>
    </mat-card>

    <div class="errors-summary-container" *ngIf="errorsSummary !== null; else tableRef">
        <app-errors-summary [errorsSummary]="errorsSummary!">
        </app-errors-summary>
    </div>

    <ng-template #tableRef>

        <mat-form-field class="filter-form-field">
            <mat-label>Search</mat-label>
            <input matInput (keyup)="applyFilter($event)" #input>
        </mat-form-field>
    
        <div class="mat-table-container">
            <table mat-table [dataSource]="dataSource" matSort>
    
                <ng-container matColumnDef="qrcid">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> QR&nbsp;ID </th>
                <td mat-cell *matCellDef="let row"> {{row.qrcid}} </td>
                </ng-container>
            
                <ng-container matColumnDef="itemRefNo">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> <span class="no-wrap">Item Ref / Reel Code</span> </th>
                <td mat-cell *matCellDef="let row"> {{row.itemRefNo}} </td>
                </ng-container>
            
                <ng-container matColumnDef="qty">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Qty </th>
                <td mat-cell *matCellDef="let row"> {{row.qty}} </td>
                </ng-container>
            
                <ng-container matColumnDef="createdLocation">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Created&nbsp;Location </th>
                <td mat-cell *matCellDef="let row" class="no-wrap"> {{row.createdLocation}} </td>
                </ng-container>
            
                <ng-container matColumnDef="dateTime">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Created&nbsp;Date/Time </th>
                <td mat-cell *matCellDef="let row" class="no-wrap"> {{row.dateTime | date: 'dd MMM y h:mm a'}} </td>
                </ng-container>
            
                <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Actions </th>
                <td mat-cell *matCellDef="let row" class="no-wrap">
                    <a mat-raised-button color="accent" [routerLink]="'../View/'+row.qrcid">View</a>
                </td>
                </ng-container>
            
                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            
                <!-- Row shown when there is no matching data. -->
                <tr class="mat-row" *matNoDataRow>
                    <td class="mat-cell" colspan="7"><div class="txt-center">No data matching the filter "{{input.value}}"</div></td>
                </tr>

            </table>
        </div>
    
        <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]"></mat-paginator>

    </ng-template>

</div>
<a mat-fab color="primary" class="floating-fab" cdkDrag
matTooltip="New" routerLink="../New">
    <mat-icon>add</mat-icon>
</a>
