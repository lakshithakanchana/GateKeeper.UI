<h2 mat-dialog-title>Scan QR</h2>
<div mat-dialog-content>
    <zxing-scanner
    [formats]="allowedFormats"
    (scanSuccess)="onScanSuccess($event)">
  </zxing-scanner>
</div>
<div mat-dialog-actions align="end">
  <button mat-raised-button [mat-dialog-close]="null" cdkFocusInitial color="accent">
    Cancel
  </button>
</div>
